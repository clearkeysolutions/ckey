org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Native modules compiled into libckey_jni.so (all true for the published AAR).
# Apps that build the SDK from source can drop parts, e.g. a scan-only app:
#   -Pckey.native.render=false   (no renderer: CKeySymbol.toBitmap etc. throw UnsupportedOperationException)
#   -Pckey.native.scan=false     (render-only: CKeyDecoder throws UnsupportedOperationException)
#   -Pckey.native.telemetry=false (no telemetry core: CKey.telemetry reads 0, nothing is ever counted or sent)
ckey.native.scan=true
ckey.native.render=true
ckey.native.telemetry=true
