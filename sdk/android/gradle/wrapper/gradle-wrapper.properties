# Wrapper properties only: no gradle-wrapper.jar or gradlew scripts are committed.
# CI uses gradle/actions/setup-gradle with the same pinned version. To use a
# wrapper locally, run `gradle wrapper --gradle-version 8.10.2` once (it
# generates the jar and scripts; do not commit the jar).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
# Maintainers: add distributionSha256Sum for 8.10.2 from https://gradle.org/release-checksums/
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
