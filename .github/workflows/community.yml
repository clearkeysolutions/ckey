# Checks for contributions to the community branch (spec §8). Runs on
# pull_request (never pull_request_target), so code from forks gets no
# secrets and a read-only token. Nothing here can publish.
name: Community checks
on:
  pull_request:
    branches: [community]
  push:
    branches: [community]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Community rules
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qx 'VERSION'; then echo "::error::community changes must not edit VERSION (see CHANGELOG-COMMUNITY.md)"; exit 1; fi
          if echo "$changed" | grep -q '^\.github/workflows/release\.yml$'; then echo "::error::community changes must not edit the release workflow"; exit 1; fi
          if ! echo "$changed" | grep -qx 'CHANGELOG-COMMUNITY.md'; then echo "::warning::add an entry to CHANGELOG-COMMUNITY.md"; fi
