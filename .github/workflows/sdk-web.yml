# Web SDK (npm package `openckey`): the C core compiled to WebAssembly with
# Emscripten, plus the JavaScript wrapper. Maintainers: pin these actions to
# commit SHAs (as ci.yml does) before relying on this workflow.
name: SDK Web
on:
  push:
    branches: ['**']   # not tags: a release tag runs these inside the Release workflow
    paths:
      - 'sdk/web/**'
      - 'src/**'
      - 'include/**'
      - 'VERSION'
      - '.github/workflows/sdk-web.yml'
  pull_request:
    paths:
      - 'sdk/web/**'
      - 'src/**'
      - 'include/**'
      - 'VERSION'
      - '.github/workflows/sdk-web.yml'
  workflow_dispatch:
  workflow_call:   # the release workflow builds release packages with this file
permissions:
  contents: read
defaults:
  run:
    working-directory: sdk/web
jobs:
  js-and-bridge:
    name: JS units + native bridge
    # Public repository, private runner: never run a fork's pull request here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Package version matches VERSION
        run: test "$(node -p "require('./package.json').version")" = "$(cat ../../VERSION)"
      - name: node --check
        run: npm run check
      - name: Unit tests (no WebAssembly)
        run: npm test
      - name: Native bridge test (g++, sanitizers)
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: npm run test:native

  wasm:
    name: Emscripten build + tests
    # Public repository, private runner: never run a fork's pull request here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build (emcmake + em++)
        run: npm run build
      - name: Tests against the built wasm
        env:
          CKEY_REQUIRE_WASM: '1'
        run: npm test
      - name: Package
        run: npm pack
      # Staged on this Mac for the Release workflow's publish job, instead of an Actions
      # artifact (the account's artifact storage quota blocked releases; see build 126).
      # Paths are relative to sdk/web (this workflow's working-directory).
      - name: Stage ckey-npm for the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf "${HOME:?}/ckey-release/${{ github.run_id }}/ckey-npm" && mkdir -p "$HOME/ckey-release/${{ github.run_id }}/ckey-npm"
          cp openckey-*.tgz "$HOME/ckey-release/${{ github.run_id }}/ckey-npm/"
          ls -la "$HOME/ckey-release/${{ github.run_id }}/ckey-npm"
      # Staged on this Mac for the Release workflow's publish job, instead of an Actions
      # artifact (the account's artifact storage quota blocked releases; see build 126).
      - name: Stage ckey-web-dist for the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf "${HOME:?}/ckey-release/${{ github.run_id }}/ckey-web-dist" && mkdir -p "$HOME/ckey-release/${{ github.run_id }}/ckey-web-dist"
          cp -R dist/. "$HOME/ckey-release/${{ github.run_id }}/ckey-web-dist/"
          ls -la "$HOME/ckey-release/${{ github.run_id }}/ckey-web-dist"
